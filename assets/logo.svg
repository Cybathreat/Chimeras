<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280" width="800" height="280">
  <defs>
    <!-- Vibrant purple gradient (brighter for dark bg contrast) -->
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BB4DEE"/>
      <stop offset="100%" stop-color="#8E2DE2"/>
    </linearGradient>
    <!-- Electric cyan -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#00B4D8"/>
    </linearGradient>
    <!-- Mane gradient (brighter) -->
    <linearGradient id="maneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <!-- Hex ring gradient -->
    <linearGradient id="hexGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="50%" stop-color="#8E2DE2"/>
      <stop offset="100%" stop-color="#BB4DEE"/>
    </linearGradient>
  </defs>

  <!-- Background (transparent for GitHub) -->

  <!-- ===== HEX EMBLEM ===== -->
  <g transform="translate(130, 140)">
    <!-- Outer hex ring (gradient stroke, thicker) -->
    <polygon points="0,-95 82.3,-47.5 82.3,47.5 0,95 -82.3,47.5 -82.3,-47.5"
             fill="none" stroke="url(#hexGrad)" stroke-width="3.5"/>
    <!-- Inner hex ring -->
    <polygon points="0,-80 69.3,-40 69.3,40 0,80 -69.3,40 -69.3,-40"
             fill="none" stroke="#3D2B5F" stroke-width="1.5"/>

    <!-- Circuit nodes on hex vertices -->
    <circle cx="0" cy="-95" r="4" fill="#00F0FF"/>
    <circle cx="82.3" cy="-47.5" r="4" fill="#00F0FF"/>
    <circle cx="82.3" cy="47.5" r="4" fill="#BB4DEE"/>
    <circle cx="0" cy="95" r="4" fill="#BB4DEE"/>
    <circle cx="-82.3" cy="47.5" r="4" fill="#00F0FF"/>
    <circle cx="-82.3" cy="-47.5" r="4" fill="#BB4DEE"/>

    <!-- Chimera: Lion head (geometric/low-poly) -->
    <!-- Main head shape (brighter purple) -->
    <path d="M -30,-35 L -38,-15 L -35,5 L -25,20 L -10,28 L 0,30 L 10,28 L 25,20 L 35,5 L 38,-15 L 30,-35 L 20,-42 L 0,-45 L -20,-42 Z"
          fill="url(#purpleGrad)"/>
    <!-- Mane spikes (left) -->
    <path d="M -30,-35 L -48,-25 L -42,-10 L -38,-15 Z" fill="url(#maneGrad)"/>
    <path d="M -38,-15 L -50,5 L -38,8 L -35,5 Z" fill="url(#maneGrad)"/>
    <path d="M -35,5 L -45,25 L -28,22 L -25,20 Z" fill="url(#maneGrad)"/>
    <!-- Mane spikes (right) -->
    <path d="M 30,-35 L 48,-25 L 42,-10 L 38,-15 Z" fill="url(#maneGrad)"/>
    <path d="M 38,-15 L 50,5 L 38,8 L 35,5 Z" fill="url(#maneGrad)"/>
    <path d="M 35,5 L 45,25 L 28,22 L 25,20 Z" fill="url(#maneGrad)"/>

    <!-- Eyes (glowing cyan - bigger) -->
    <ellipse cx="-13" cy="-12" rx="6" ry="4" fill="#00F0FF"/>
    <ellipse cx="13" cy="-12" rx="6" ry="4" fill="#00F0FF"/>
    <!-- Eye pupils -->
    <circle cx="-13" cy="-12" r="2" fill="#0D0D1A"/>
    <circle cx="13" cy="-12" r="2" fill="#0D0D1A"/>
    <!-- Eye glow (outer ring) -->
    <circle cx="-13" cy="-12" r="8" fill="none" stroke="#00F0FF" stroke-width="0.5" opacity="0.4"/>
    <circle cx="13" cy="-12" r="8" fill="none" stroke="#00F0FF" stroke-width="0.5" opacity="0.4"/>

    <!-- Nose -->
    <path d="M -4,5 L 0,10 L 4,5 L 2,3 L -2,3 Z" fill="#5B2C6F"/>

    <!-- Circuit lines from eyes outward (AI/swarm motif) -->
    <path d="M -19,-12 L -55,-12 L -60,-20" fill="none" stroke="#00F0FF" stroke-width="1.2" opacity="0.6"/>
    <path d="M 19,-12 L 55,-12 L 60,-20" fill="none" stroke="#00F0FF" stroke-width="1.2" opacity="0.6"/>
    <circle cx="-60" cy="-20" r="2.5" fill="#00F0FF" opacity="0.7"/>
    <circle cx="60" cy="-20" r="2.5" fill="#00F0FF" opacity="0.7"/>

    <!-- Serpent tail curving from bottom (chimera element) -->
    <path d="M 0,30 C 5,45 15,55 25,60 C 30,62 35,58 33,53 C 28,48 22,42 18,35"
          fill="none" stroke="url(#cyanGrad)" stroke-width="3"/>
    <!-- Serpent head -->
    <circle cx="33" cy="53" r="4.5" fill="#00F0FF"/>
    <circle cx="33" cy="53" r="2" fill="#0D0D1A"/>

    <!-- Circuit dots pattern (swarm nodes - 10 dots for 10 bots) -->
    <circle cx="-55" cy="40" r="2.5" fill="#BB4DEE" opacity="0.7"/>
    <circle cx="-60" cy="55" r="2" fill="#00F0FF" opacity="0.5"/>
    <circle cx="-50" cy="62" r="2" fill="#BB4DEE" opacity="0.5"/>
    <path d="M -55,40 L -60,55 L -50,62" fill="none" stroke="#8E2DE2" stroke-width="0.8" opacity="0.4"/>
  </g>

  <!-- ===== TEXT ===== -->
  <!-- CHIMERAS wordmark -->
  <text x="270" y="120" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="62" font-weight="700" letter-spacing="8" fill="#F0F0F5">
    CHIMERAS
  </text>
  <!-- Underline accent (gradient) -->
  <rect x="272" y="138" width="180" height="3" rx="1.5" fill="url(#cyanGrad)"/>
  <!-- Subtitle -->
  <text x="274" y="168" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="16" font-weight="500" letter-spacing="4" fill="#BB4DEE">
    AUTONOMOUS AI PENTEST SWARM
  </text>
  <!-- Version tag -->
  <text x="274" y="196" font-family="'Courier New', monospace"
        font-size="13" font-weight="400" letter-spacing="2" fill="#00F0FF" opacity="0.9">
    v2.2 · 10 AGENTS · ADAPTIVE ROUTING
  </text>

  <!-- ===== DECORATIVE CIRCUIT LINES (right side) ===== -->
  <g opacity="0.2" stroke="#8E2DE2" stroke-width="1" fill="none">
    <path d="M 760,60 L 780,60 L 780,90 L 760,90"/>
    <path d="M 730,180 L 760,180 L 760,200 L 740,200"/>
    <path d="M 690,40 L 710,40 L 710,20"/>
    <circle cx="780" cy="60" r="2" fill="#00F0FF" stroke="none"/>
    <circle cx="780" cy="90" r="2" fill="#BB4DEE" stroke="none"/>
    <circle cx="760" cy="180" r="2" fill="#BB4DEE" stroke="none"/>
    <circle cx="710" cy="20" r="2" fill="#00F0FF" stroke="none"/>
  </g>
</svg>